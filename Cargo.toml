[workspace]
resolver = "3"
members = [
  "crates/tokrepr",
  "crates/tokrepr-derive",
  "crates/wesl",
  "crates/wesl-c",
  "crates/wesl-cli",
  "crates/wesl-core",
  "crates/wesl-macros",
  "crates/wesl-quote",
  "crates/wesl-rs-web",
  "crates/wesl-test",
  "crates/wgsl-parse",
  "crates/wgsl-types",
  "examples/buildrs_wesl",
  "examples/random_wgsl",
  "examples/runtime_wesl",
  "xtask",
]
default-members = [
  "crates/wesl",
  "crates/wesl-c",
  "crates/wesl-cli",
  "crates/wesl-core",
  "crates/wesl-macros",
  "crates/wesl-quote",
  "crates/wgsl-parse",
  "crates/wgsl-types",
]

[workspace.package]
# version bumps managed by `cargo xtask version`
version = "0.5.0"
edition = "2024"
rust-version = "1.97.1"
repository = "https://github.com/webgpu-tools/wesl-rs"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokrepr = { path = "crates/tokrepr" }
tokrepr-derive = { path = "crates/tokrepr-derive" }
wesl = { path = "crates/wesl" }
wesl-core = { path = "crates/wesl-core" }
wesl-macros = { path = "crates/wesl-macros" }
wesl-quote = { path = "crates/wesl-quote" }
wgsl-parse = { path = "crates/wgsl-parse" }
wgsl-types = { path = "crates/wgsl-types" }

[workspace.lints.clippy]
# TODO: change eventually
mutable_key_type = "allow"

[workspace.lints.rust]

[patch.crates-io]
wesl = { path = "crates/wesl" }
wesl-core = { path = "crates/wesl-core" }

# [patch.'https://github.com/webgpu-tools/bevy-wgsl']
# bevy-wgsl = { path = "../bevy-wgsl" }
