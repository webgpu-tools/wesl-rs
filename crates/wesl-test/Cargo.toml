[package]
name = "wesl-test"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Test suite for the WESL compiler"
repository.workspace = true
license.workspace = true

[[test]]
harness = false
name = "testsuite"

[dependencies]
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
bevy-wgsl = { git = "https://github.com/webgpu-tools/bevy-wgsl", rev = "66aa82008b4c372970715017d6b19b38b99fb7b1" }
insta = { version = "1.49.0", features = ["yaml"] }
libtest-mimic = "0.8.2"
serde_json = "1.0.151"
wesl = { workspace = true, features = ["eval", "naga-ext"] }
wgsl-parse = { workspace = true }

[lints]
workspace = true
